function persist(){if(restoring)return;try{let item=sessions.find(x=>x.id===activeSession);if(!item){item={id:activeSession||String(Date.now()),title:'新的选包旅程'};activeSession=item.id;sessions.unshift(item)}Object.assign(item,{html:$('messages').innerHTML,state:{...state},selected:[...selected],lastId,lastList:[...lastList],lastMode,turn,ignored:[...ignored]});localStorage.setItem(STORE,JSON.stringify({sessions,activeSession}));renderSessions()}catch(e){if(storageOK){notify('当前浏览器无法保存记录，关闭页面前请注意保留内容');storageOK=false}}}
function renderSessions(){if(!$('sessionList'))return;$('sessionList').innerHTML=sessions.map(x=>`<div class="history-row"><button onclick="loadSession('${x.id}')">${x.id===activeSession?'• ':''}${esc(x.title)}</button><button onclick="deleteSession('${x.id}')" aria-label="删除该对话">×</button></div>`).join('')}
function loadSession(id){persist();const s=sessions.find(x=>x.id===id);if(!s)return;restore(s);persist();window.scrollTo({top:0,behavior:'smooth'})}
function restore(s){restoring=true;activeSession=s.id;state={...initialState(),...s.state};selected=new Set(s.selected||[]);lastId=s.lastId||0;lastList=s.lastList||[0,1,2];lastMode=s.lastMode||'recommend';turn=s.turn||0;ignored=new Set(s.ignored||[]);$('messages').innerHTML=s.html||'';updateNeeds();syncSelection();renderFeatured();restoring=false;renderSessions()}
function deleteSession(id){sessions=sessions.filter(x=>x.id!==id);if(id===activeSession){if(sessions.length){restore(sessions[0]);persist()}else{activeSession='';newConversation(false)}}else persist();renderSessions()}
function newConversation(save=true){if(save)persist();activeSession=Date.now().toString(36)+Math.random().toString(36).slice(2,6);state=initialState();ignored.clear();selected.clear();lastId=0;lastList=[0,1,2];lastMode='recommend';turn=0;$('messages').innerHTML='';updateNeeds();syncSelection();renderFeatured();persist();window.scrollTo({top:0,behavior:'smooth'})}

const originalAddUser=addUser;addUser=function(s){originalAddUser(s);let item=sessions.find(x=>x.id===activeSession);if(item&&item.title==='新的选包旅程')item.title=s.slice(0,20);persist()};

updateNeeds=function(){$('needs').innerHTML=activeTags().map(([k,v])=>`<button onclick="removeCondition('${k}')" aria-label="删除条件：${esc(v)}">${esc(v)} <span aria-hidden="true">×</span></button>`).join('')};
function removeCondition(k){state[k]=initialState()[k];ignored.add(k);updateNeeds();persist();notify('已移除此条件，后续不再用于筛选');if(lastMode==='recommend'){addUser('移除条件：'+({scene:'使用场景',budget:'预算',laptop:'电脑尺寸',light:'轻量',summer:'夏季轻装',style:'休闲风格',color:'颜色',capacity:'容量',storage:'分区收纳',waterproof:'防泼水'}[k]));recommend('')}}
function cnNumber(s){const map={'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};return s.replace(/([一二两三四五六七八九])百(?:([一二三四五六七八九])十)?/g,(_,a,b)=>map[a]*100+(b?map[b]*10:0)).replace(/两千/g,'2000').replace(/一千/g,'1000')}
parse=function(raw){const s=cnNumber(raw);function set(k,v){state[k]=v;ignored.delete(k)}if(/通勤|上班|上班族|工作|公司|办公室|地铁/.test(s))set('scene','日常通勤');else if(/旅行|出差|衣物|旅游|周末出游/.test(s))set('scene','短途出行');else if(/校园|上学|学生|大学|上课|课本/.test(s))set('scene','校园日常');else if(/逛街|休闲|周末/.test(s))set('scene','休闲出行');let b=s.match(/(?:预算|不超过|最多|上限|控制在|大概|大约)\s*[¥￥]?\s*(\d+)/)||s.match(/(\d+)\s*(?:元|块|以内|以下|左右)/);if(b)set('budget',Number(b[1]));let l=s.match(/(1[0-9](?:\.\d)?)\s*(?:英寸|寸)/);if(l)set('laptop',Number(l[1]));if(/轻|别太重|不要太重|不太重|不想.*重|肩膀|省力/.test(s))set('light',true);if(/夏天|夏季|透气|不闷|怕热|闷汗/.test(s))set('summer',true);if(/个性|好看|休闲|颜值|穿搭/.test(s))set('style',true);if(/收纳|分区|隔层|井井有条/.test(s))set('storage',true);if(/防水|防泼水|下雨|淋雨/.test(s))set('waterproof',true);const cm=s.match(/(黑色|绿色|浅蓝|蓝色|米白|米色|灰色)/);if(cm)set('color',cm[1]);const cap=s.match(/(\d+)\s*[Ll升]/);if(cap)set('capacity',Number(cap[1]));if(/容量大|能装|大容量/.test(s)&&!cap)set('capacity',26);if(/不带电脑|不用装电脑/.test(s))set('laptop',null);if(/不.*(?:限制预算|限预算)|预算不限|不考虑价格/.test(s)){state.budget=null;ignored.add('budget')}if(/不用.*轻|不在乎.*重|重量不限/.test(s)){state.light=false;ignored.add('light')}updateNeeds()};
function productColor(p){if(/#(?:3|4|6)/i.test(p.color.slice(0,2)))return /#6/.test(p.color)?'灰色':'黑色';if(['#a4b39c','#a2b6a0'].includes(p.color))return '绿色';if(p.color==='#b4cadb')return '浅蓝';if(p.color==='#7c8294'||p.color==='#777b87')return '灰色';return '米色'}
function qualifies(p){return(state.budget===null||p.price<=state.budget)&&(!state.laptop||p.laptop>=state.laptop)&&(!state.light||p.weight<=600)&&(!state.summer||p.weight<=650)&&(!state.style||p.style==='自然休闲')&&(!state.storage||p.style==='都市商务')&&(!state.capacity||p.capacity>=state.capacity)&&(!state.color||productColor(p)===state.color||(state.color==='蓝色'&&productColor(p)==='浅蓝')||(state.color==='米白'&&productColor(p)==='米色'))&&(!state.scene||state.scene!=='短途出行'||p.capacity>=26)}
function ranked(){return products.filter(qualifies).sort((a,b)=>score(b)-score(a))}
function suggests(mode,id){let items=mode==='analysis'?['这款适合每天背电脑吗','和第一款比哪个更轻','找几款类似的']:mode==='compare'?['按我的条件推荐一款','找更轻一点的','看看更多符合条件的']:['有没有更轻的款式','想看收纳更好的','看看更多符合条件的'];return `<div class="suggestions"><small>猜你想问</small>${items.map(t=>`<button onclick="send('${t}')">${t} ↗</button>`).join('')}</div>`}
card=function(p,badge=''){return `<article class="product"><div class="visual" style="background:${p.bg}">${badge?`<span class="badge">${badge}</span>`:''}${bag(p)}</div><div class="product-body"><h3>${p.name}</h3><div class="desc">${p.brand} · ${p.style}</div><div class="price">¥${p.price}<small>参考价</small></div><div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="product-actions"><button onclick="analyze(${p.id})">查看分析 ↗</button><button data-select="${p.id}" class="${selected.has(p.id)?'selected':''}" onclick="toggleCompare(${p.id})">${selected.has(p.id)?'✓ 已选':'＋ 对比'}</button></div><a style="font-size:10px;display:block;margin-top:8px" href="https://search.jd.com/Search?keyword=${encodeURIComponent('双肩包 '+p.style)}" target="_blank" rel="noopener noreferrer">搜索同类商品 ↗</a></div></article>`};
recommend=function(raw){lastMode='recommend';parse(raw);turn++;const pool=ranked();lastList=pool.slice(0,4).map(p=>p.id);if(!pool.length){answer(`<h3>这些条件放在一起，暂时没有匹配款</h3><p>我保留了你的全部条件，没有自动放宽。可删除输入框上方的某个条件，或修改预算、颜色及容量后再选。</p>${suggests('recommend')}`);return}lastId=pool[0].id;const q=!state.scene&&!ignored.has('scene')?['你主要在哪种场景背它？',['上班通勤','校园日常','短途旅行']]:state.budget===null&&!ignored.has('budget')?['预算希望控制在多少以内？',['预算200元以内','预算300元以内','预算400元以内']]:/电脑|笔记本/.test(raw)&&!state.laptop&&!ignored.has('laptop')?['你的电脑是多大尺寸？',['14英寸电脑','15.6英寸电脑','16英寸电脑']]:null;answer(`<h3>${turn>1?'按你保留的条件，重新挑选':'先看这几款，再慢慢找到最合适的'}</h3><p>${activeTags().length?'以下款式同时满足当前标签条件。':'先按日常易搭、轻装与实用性给你几个方向。'}主推 <b>${pool[0].name}</b>，${pool[0].pros[0]}。</p><p>取舍先说清：${pool[0].cons[0]}。${state.summer?'“夏季轻装”按包重 ≤650g 筛选，不代表实测不闷背。':''}</p><div class="products">${pool.slice(0,4).map((p,i)=>card(p,i===0?'主推 · 更匹配':'备选 · '+p.style)).join('')}</div><button class="more-btn" onclick="showMore()">查看更多符合条件的商品（${pool.length}）⌄</button>${q?`<div class="question"><strong>${q[0]}</strong><div class="choices">${q[1].map(t=>`<button onclick="send('${t}')">${t}</button>`).join('')}</div></div>`:''}${suggests('recommend')}`)};
function showMore(offset=0){const pool=ranked();modal('更多符合条件的背包',`<p class="desc">当前共 ${pool.length} 款，同时满足已保留条件。点击分析可查看优缺点和评论。</p><div class="result-grid">${pool.slice(offset,offset+8).map(p=>card(p)).join('')}</div><div class="choices">${offset>0?`<button onclick="showMore(${offset-8})">上一页</button>`:''}${offset+8<pool.length?`<button onclick="showMore(${offset+8})">下一页</button>`:''}<span class="desc">${pool.length?Math.floor(offset/8)+1:0} / ${Math.ceil(pool.length/8)} 页</span></div>`)}
analyze=function(id,user=true){closeModal();const p=products[id];lastId=id;lastMode='analyze';if(user)addUser(`帮我看看「${p.name}」怎么样`);answer(`<h3>${p.name} · 信息与评价</h3><p>更适合${p.fit}。${qualifies(p)?'符合当前保留的筛选条件。':'<b class="negative">这款未满足全部已选条件，请留意参数与需求的差异。</b>'}</p><div style="display:flex;gap:15px;align-items:center;background:${p.bg};padding:12px;border-radius:12px">${bag(p)}<div><b>参考价 ¥${p.price}</b><p>${p.weight}g · ${p.capacity}L<br>电脑标称适配最高 ${p.laptop} 英寸<br>${productColor(p)} · ${p.style}<br>面料防泼水，不代表完全防水</p></div></div><h4 class="positive">＋ 优势</h4>${p.pros.map(t=>`<p>• ${t}</p>`).join('')}<h4 class="negative">－ 局限与注意事项</h4>${p.cons.map(t=>`<p>• ${t}</p>`).join('')}<h4>评价摘要</h4><p>${p.reviewNote.replace('模拟评论','资料样本')}。体验因负重与背负时间而异，以下为资料库中的体验描述。</p>${p.reviews.map(t=>`<div class="review">${t}</div>`).join('')}<p>结论：如果以${p.fit}为主可以考虑；经常重负载时，应重点核对肩带与背板。电脑英寸标称不能替代实际内尺寸。</p><div class="choices"><button onclick="toggleCompare(${id})">加入 / 移出对比</button><button onclick="similar(${id})">看看类似款</button><a href="https://search.jd.com/Search?keyword=${encodeURIComponent('背包 '+p.style)}" target="_blank" rel="noopener noreferrer">搜索同类商品 ↗</a></div>${suggests('analysis',id)}`)};
similar=function(id){const p=products[id];addUser('看看「'+p.name+'」的类似款');let pool=ranked().filter(x=>x.id!==id).sort((a,b)=>Math.abs(a.capacity-p.capacity)-Math.abs(b.capacity-p.capacity));lastMode='similar';lastList=pool.slice(0,4).map(p=>p.id);answer(`<h3>相近用途，看看其他取舍</h3><p>以容量和用途接近为先，同时保留你的全部筛选条件。</p>${pool.length?`<div class="products">${pool.slice(0,4).map(p=>card(p,p.fit)).join('')}</div><button class="more-btn" onclick="showMore()">查看更多符合条件的商品 ⌄</button>`:'<p>当前条件组合过窄，不能为了展示类似款而忽略条件。删除不再需要的标签即可扩大范围。</p>'}${suggests('analysis')}`)};
const oldCompare=compare;compare=function(ids){const old=answer;answer=function(html){html=html.replace(/演示价格/g,'参考价格').replace(/电脑适配（演示）/g,'电脑标称适配').replace(/模拟好评率/g,'资料好评率').replace(/所有参数为模拟数据；/g,'参数以实际商品详情为准；');old(html+suggests('compare'))};try{oldCompare(ids)}finally{answer=old}persist()};

function resolveTarget(s){const explicit=products.find(p=>s.includes(p.name)||s.includes(p.name.split(' ')[0]));if(explicit)return explicit.id;const order=s.match(/第?([一二三四五12345])(?:款|个|只)/);if(order){let n={'一':0,'二':1,'三':2,'四':3,'五':4,'1':0,'2':1,'3':2,'4':3,'5':4}[order[1]];return lastList[n]??lastId}return lastId}
send=function(text){const s=(text===undefined?$('input').value:text).trim();if(!s)return;$('input').value='';if(s==='/clear'){resetChat();return}if(/https?:\/\//.test(s)){addUser(s);answer('<h3>已收到商品链接</h3><p>当前未连接该平台商品读取服务，无法核实这条链接的参数与评论。可以从购物车选款，或上传图片按外观寻找候选。</p><div class="choices"><button onclick="showCart()">从购物车选款</button><button onclick="document.getElementById(\'photoInput\').click()">上传商品图片</button></div>');return}if(/更多|全部|多一些|换一批|还有哪些/.test(s)){addUser(s);showMore();return}let id=resolveTarget(s);if(/类似|相似|同款|同类|差不多/.test(s)){similar(id);return}if(/对比|比较|哪个|哪一款|哪款/.test(s)&&!(/推荐|想买|找个/.test(s))){if(/轻|重|便宜|贵|容量|能装|防水|透气/.test(s)&&lastList.length>=2){compare(lastList.slice(0,3));return}openCompare();return}if(/怎么样|如何|评价|优缺|好不好|值得|靠谱吗|质量|做工|耐用|防水吗|闷吗|舒不舒服|适合.*吗|能装.*吗|详细|介绍|了解|说说|看看这|这款|这只|第二款|第一款|第三款|缺点|不足|背着/.test(s)){addUser(s);analyze(id,false);return}if(/谢谢|明白|收到/.test(s)){addUser(s);answer('<p>不客气。你可以继续比较商品，或删掉不再需要的条件，重新看看选择。</p>'+suggests('recommend'));return}addUser(s);recommend(s)};
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('当前浏览器不支持语音转写，请尝试 Chrome 或 Edge，或直接输入');return}if(!window.isSecureContext){notify('语音输入需要 HTTPS 安全连接');return}if(window.bagRecognition){window.bagRecognition.stop();return}const r=new SR();window.bagRecognition=r;r.lang='zh-CN';r.interimResults=true;r.continuous=false;const before=$('input').value;$('micBtn').textContent='● 正在聆听，点击结束';$('micBtn').classList.add('recording');r.onresult=e=>{$('input').value=before+[...e.results].map(x=>x[0].transcript).join('')};r.onerror=e=>notify(e.error==='not-allowed'?'麦克风权限未获允许，请在浏览器设置中开启':'语音转写暂不可用，请重试或输入文字');r.onend=()=>{window.bagRecognition=null;$('micBtn').textContent='♩ 语音输入';$('micBtn').classList.remove('recording');$('input').focus()};try{r.start()}catch(e){r.onend();notify('未能启动语音输入，请重试')}}
